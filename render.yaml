# One-click deploy of the READ-ONLY dashboard on Render's free tier.
#
# Render builds the Dockerfile, which contains no credentials and no broker
# client. The free plan sleeps after 15 minutes idle, so the first request
# from a cold start takes roughly 30 seconds - fine for a demo link, and the
# health check keeps it warm while anyone is actually looking at it.
services:
  - type: web
    name: vetoed-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
